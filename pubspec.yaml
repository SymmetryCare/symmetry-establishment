name: symmetry_establishment
description: "Symmetry Establishment module — company identity, offices, coverage, masters."
publish_to: 'none'

version: 1.1.0

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  app_links: ^6.1.4
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.2
  dio: ^5.7.0
  dotted_border: ^2.1.0
  dropdown_button2: ^2.3.9
  encrypt: ^5.0.3
  file_picker: ^8.1.3
  file_saver: ^0.4.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  fl_chart: ^0.70.1
  flex_color_picker: ^3.5.1
  flutter_dotenv: ^6.0.1
  flutter_html: ^3.0.0-beta.2
  flutter_pdfview: ^1.3.3
  flutter_rating_stars: ^1.1.0
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: 11.0.0
  geocoding: ^3.0.0
  geolocator: ^11.0.0
  get: ^4.6.6
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.9.0
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  intl_phone_number_input: ^0.7.4
  mask_text_input_formatter: ^2.9.0
  mime: ^2.0.0
  open_file: ^3.5.10
  open_filex: ^4.7.0
  path_provider: ^2.0.9
  pdf: ^3.11.1
  pdfx: ^2.9.2
  printing: ^5.13.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  signature: ^5.0.0
  syncfusion_flutter_charts: ^28.2.4
  syncfusion_flutter_gauges: ^28.2.4
  universal_io: ^2.2.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0

# Force consistent versions across conflicting transitive dependencies
dependency_overrides:
  # flutter_html 3.0.0 calls query_selector.matches(), removed in html 0.15.7.
  html: 0.15.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - config/establishment.env
    - assets/png/
    - images/
    - images/em_dashboard/
    - images/error/
    - images/hh_emr/
    - images/hr_dashboard/
    - images/sm/sm_refferal/
    - images/tab_images/
